services:
  aeron-media-driver:
    build:
      context: .
      target: runtime
    image: fx-recon:runtime
    entrypoint: []
    command: ["aeronmd", "-Daeron.dir=/dev/shm/aeron-media", "-Daeron.socket.soReusePort=true"]
    environment:
      - AERON_DIR=/dev/shm/aeron-media
    networks:
      - recon-net
    ports:
      - "20121:20121/udp"
      - "20122:20122/udp"
    shm_size: 512m

  recon-daemon:
    build:
      context: .
      target: runtime
    image: fx-recon:runtime
    depends_on:
      - aeron-media-driver
    environment:
      - AERON_DIR=/dev/shm/aeron-media
    networks:
      - recon-net
    command: ["aeron:udp?endpoint=aeron-media-driver:20121", "1001", "aeron:udp?endpoint=aeron-media-driver:20122", "1002"]
    shm_size: 256m
    ipc: container:aeron-media-driver

  unit-tests:
    build:
      context: .
      target: dev
    image: fx-recon:dev
    working_dir: /workspace
    command: ["ctest", "--preset", "release", "--output-on-failure"]
    environment:
      - AERON_DIR=/dev/shm/aeron-root
    shm_size: 256m

  integration-tests:
    build:
      context: .
      target: dev
    image: fx-recon:dev
    working_dir: /workspace
    command: ["ctest", "--preset", "release", "--output-on-failure", "-R", "integration_aeron_flow"]
    environment:
      - AERON_DIR=/dev/shm/aeron-root
    shm_size: 256m

  dev-shell:
    build:
      context: .
      target: dev
    image: fx-recon:dev
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      - AERON_DIR=/dev/shm/aeron-root
    shm_size: 256m

networks:
  recon-net:
    driver: bridge

volumes:
  aeron-md-data: